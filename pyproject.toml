[project]
name = "invoice-extract"
version = "0.1.0"
description = "Extract structured invoice fields from PDFs with review flags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
invoice-extract = "invoice_extract.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["invoice_extract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
